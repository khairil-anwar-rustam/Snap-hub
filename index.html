<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snap-Hub | Disposable Camera & Voice Notes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap');
    
    .font-retro { font-family: 'VT323', monospace; }
    .font-mono-tech { font-family: 'Share Tech Mono', monospace; }

    .retro-grain {
      background-image: radial-gradient(rgba(0, 0, 0, 0.15) 1px, transparent 0);
      background-size: 4px 4px;
    }

    .viewfinder-overlay {
      background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.4) 100%);
    }

    /* Flash Animation */
    @keyframes flash-screen {
      0% { opacity: 1; background-color: white; }
      100% { opacity: 0; background-color: transparent; }
    }
    .flash-effect {
      animation: flash-screen 0.4s ease-out;
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col justify-between font-mono-tech select-none">

  <!-- Flash Screen Layer -->
  <div id="flash-layer" class="fixed inset-0 pointer-events-none z-50 opacity-0"></div>

  <!-- Header / Status Bar -->
  <header class="bg-black/60 backdrop-blur border-b border-yellow-600/30 p-4 flex justify-between items-center z-10">
    <div class="flex items-center gap-2">
      <i class="fa-solid font-retro text-2xl text-yellow-500 fa-camera-retro"></i>
      <h1 class="text-xl font-bold tracking-widest text-yellow-400 font-retro">SNAP-HUB v1.0</h1>
    </div>
    <button onclick="toggleSettingsModal()" class="bg-yellow-500/20 hover:bg-yellow-500/30 text-yellow-400 border border-yellow-500/50 px-3 py-1 rounded flex items-center gap-2 text-sm transition">
      <i class="fa-solid fa-gear"></i> Tetapan GitHub
    </button>
  </header>

  <!-- Main Camera & Audio Viewport -->
  <main class="flex-1 max-w-md w-full mx-auto p-4 flex flex-col justify-center items-center gap-4">

    <!-- Retro Camera Body -->
    <div class="w-full bg-yellow-500 border-4 border-yellow-600 rounded-3xl p-4 shadow-2xl relative text-gray-900">
      
      <!-- Top Info Panel -->
      <div class="flex justify-between items-center mb-3 px-2">
        <!-- Film Roll Counter -->
        <div class="bg-black text-red-500 font-retro text-2xl px-3 py-0.5 rounded border border-gray-700 shadow-inner tracking-widest">
          SHOTS: <span id="shot-counter">00</span>
        </div>
        
        <!-- Camera Controls & Switch -->
        <div class="flex gap-2">
          <button id="switch-camera-btn" onclick="switchCamera()" class="bg-gray-800 text-yellow-400 p-2 rounded-full border border-gray-600 hover:bg-gray-700 transition">
            <i class="fa-solid fa-arrows-rotate"></i>
          </button>
          <button id="toggle-flash-btn" onclick="toggleFlashSetting()" class="bg-gray-800 text-yellow-400 p-2 rounded-full border border-gray-600 hover:bg-gray-700 transition">
            <i id="flash-icon" class="fa-solid fa-bolt-slash"></i>
          </button>
        </div>
      </div>

      <!-- Viewfinder / Camera Screen -->
      <div class="relative aspect-[4/3] bg-black rounded-xl overflow-hidden border-4 border-gray-800 shadow-inner group">
        <video id="webcam" autoplay playsinline class="w-full h-full object-cover transform scale-x-[-1]"></video>
        <canvas id="photo-canvas" class="hidden"></canvas>
        <div class="absolute inset-0 viewfinder-overlay pointer-events-none"></div>
        <div class="absolute inset-0 retro-grain pointer-events-none opacity-40"></div>
        
        <!-- Viewfinder Frame Crosshair -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-30">
          <div class="w-12 h-12 border border-white/60 rounded-full flex items-center justify-center">
            <div class="w-1 h-1 bg-white rounded-full"></div>
          </div>
        </div>

        <!-- Camera Status Overlay -->
        <div id="camera-error" class="absolute inset-0 bg-black/90 flex flex-col items-center justify-center p-4 text-center hidden">
          <i class="fa-solid fa-triangle-exclamation text-red-500 text-3xl mb-2"></i>
          <p class="text-xs text-gray-300 mb-3" id="camera-error-msg">Gagal memuatkan kamera.</p>
          <button onclick="initCamera()" class="bg-yellow-500 text-black font-bold text-xs px-3 py-1.5 rounded hover:bg-yellow-400">Cuba Semula</button>
        </div>
      </div>

      <!-- Filter Selection -->
      <div class="mt-3 grid grid-cols-4 gap-1 text-xs">
        <button onclick="setFilter('none')" class="filter-btn bg-gray-800 text-white py-1 rounded border border-gray-700 font-bold active-filter" data-filter="none">NORMAL</button>
        <button onclick="setFilter('warm')" class="filter-btn bg-yellow-900/40 text-yellow-300 py-1 rounded border border-gray-700" data-filter="warm">WARM</button>
        <button onclick="setFilter('bw')" class="filter-btn bg-gray-700 text-gray-200 py-1 rounded border border-gray-700" data-filter="bw">B&W</button>
        <button onclick="setFilter('vintage')" class="filter-btn bg-amber-900/40 text-amber-300 py-1 rounded border border-gray-700" data-filter="vintage">VINTAGE</button>
      </div>

      <!-- Main Shutter Button -->
      <div class="mt-4 flex justify-center">
        <button onclick="takePicture()" class="w-20 h-20 bg-red-600 hover:bg-red-500 active:scale-95 border-4 border-white rounded-full shadow-lg flex items-center justify-center transition">
          <div class="w-14 h-14 border-2 border-red-800 rounded-full flex items-center justify-center">
            <i class="fa-solid fa-camera text-white text-xl"></i>
          </div>
        </button>
      </div>
    </div>

    <!-- Voice Note Recorder Module -->
    <div class="w-full bg-gray-800 border-2 border-gray-700 rounded-2xl p-4 shadow-xl flex flex-col gap-3">
      <div class="flex justify-between items-center">
        <span class="text-sm font-bold text-gray-300 flex items-center gap-2">
          <i class="fa-solid fa-microphone text-red-400"></i> VOICE NOTE
        </span>
        <span id="record-timer" class="text-xs font-mono text-red-400">00:00</span>
      </div>

      <div class="flex items-center gap-3">
        <button id="record-btn" onclick="toggleRecording()" class="flex-1 bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-500/40 py-2 rounded-xl flex items-center justify-center gap-2 transition font-bold text-sm">
          <i id="record-icon" class="fa-solid fa-circle text-xs text-red-500"></i> <span id="record-label">Rakram Suara</span>
        </button>
      </div>

      <!-- Preview Player for Voice Note -->
      <div id="audio-preview-container" class="hidden flex items-center gap-2 bg-gray-900 p-2 rounded-lg border border-gray-700">
        <audio id="audio-player" controls class="w-full h-8"></audio>
        <button onclick="uploadVoiceNote()" class="bg-blue-600 text-white px-3 py-1.5 rounded text-xs font-bold hover:bg-blue-500 shrink-0">
          <i class="fa-solid fa-cloud-arrow-up"></i> Hantar
        </button>
      </div>
    </div>

    <!-- Upload Log / Status Window -->
    <div class="w-full bg-black/80 border border-gray-800 rounded-xl p-3 text-xs font-mono text-gray-400 h-28 overflow-y-auto" id="upload-log">
      <p class="text-gray-500">[SYSTEM] Sistem sedia. Sila masukkan maklumat GitHub di Tetapan.</p>
    </div>

  </main>

  <!-- GitHub Settings Modal -->
  <div id="settings-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-gray-800 border border-gray-700 rounded-2xl max-w-sm w-full p-5 text-gray-200">
      <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
        <h3 class="font-bold text-yellow-400 flex items-center gap-2">
          <i class="fa-brands fa-github"></i> Tetapan GitHub Repositori
        </h3>
        <button onclick="toggleSettingsModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block mb-1 text-gray-400">GitHub Personal Access Token (PAT)</label>
          <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white focus:outline-none focus:border-yellow-500">
        </div>
        <div>
          <label class="block mb-1 text-gray-400">GitHub Username / Owner</label>
          <input type="text" id="gh-owner" placeholder="Khairil-Anwar-Rustam" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white focus:outline-none focus:border-yellow-500">
        </div>
        <div>
          <label class="block mb-1 text-gray-400">Repository Name</label>
          <input type="text" id="gh-repo" placeholder="Snap-hub" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white focus:outline-none focus:border-yellow-500">
        </div>
        <div>
          <label class="block mb-1 text-gray-400">Branch Name</label>
          <input type="text" id="gh-branch" placeholder="main" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white focus:outline-none focus:border-yellow-500">
        </div>
      </div>

      <div class="mt-5 flex gap-2">
        <button onclick="saveSettings()" class="flex-1 bg-yellow-500 text-black font-bold py-2 rounded hover:bg-yellow-400 transition">Simpan Tetapan</button>
      </div>
    </div>
  </div>

  <script>
    let currentStream = null;
    let facingMode = 'user'; // 'user' atau 'environment'
    let flashEnabled = false;
    let selectedFilter = 'none';
    let shotCount = 0;

    // Audio Recorder variables
    let mediaRecorder;
    let audioChunks = [];
    let audioBlob = null;
    let recordTimerInterval;
    let secondsRecorded = 0;

    // Load Settings on Start
    window.addEventListener('DOMContentLoaded', () => {
      loadSettings();
      initCamera();
    });

    function logMessage(msg, type = 'info') {
      const logContainer = document.getElementById('upload-log');
      const p = document.createElement('p');
      const time = new Date().toLocaleTimeString();
      p.className = type === 'error' ? 'text-red-400' : type === 'success' ? 'text-green-400' : 'text-gray-400';
      p.innerText = `[${time}] ${msg}`;
      logContainer.appendChild(p);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    // Camera Management
    async function initCamera() {
      const video = document.getElementById('webcam');
      const errorDiv = document.getElementById('camera-error');
      errorDiv.classList.add('hidden');

      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      const constraintsList = [
        { video: { facingMode: { exact: facingMode }, width: { ideal: 1280 }, height: { ideal: 960 } } },
        { video: { facingMode: facingMode } },
        { video: true }
      ];

      for (let constraint of constraintsList) {
        try {
          currentStream = await navigator.mediaDevices.getUserMedia(constraint);
          video.srcObject = currentStream;
          
          // Mirror view logic
          if (facingMode === 'user') {
            video.style.transform = 'scaleX(-1)';
          } else {
            video.style.transform = 'scaleX(1)';
          }
          logMessage(`Kamera diaktifkan (${facingMode})`);
          return;
        } catch (err) {
          console.warn("Cuba tetapan kamera seterusnya...", err);
        }
      }

      document.getElementById('camera-error-msg').innerText = "Kamera tidak dapat dibuka. Sila semak kebenaran browser.";
      errorDiv.classList.remove('hidden');
    }

    function switchCamera() {
      facingMode = (facingMode === 'user') ? 'environment' : 'user';
      initCamera();
    }

    function toggleFlashSetting() {
      flashEnabled = !flashEnabled;
      const icon = document.getElementById('flash-icon');
      icon.className = flashEnabled ? 'fa-solid fa-bolt text-yellow-400' : 'fa-solid fa-bolt-slash text-gray-400';
      logMessage(`Flash: ${flashEnabled ? 'ON' : 'OFF'}`);
    }

    function setFilter(filter) {
      selectedFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('border-yellow-400', 'bg-yellow-500/20');
        if (btn.dataset.filter === filter) {
          btn.classList.add('border-yellow-400', 'bg-yellow-500/20');
        }
      });
    }

    // Capture Photo
    function takePicture() {
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('photo-canvas');
      const context = canvas.getContext('2d');

      if (!video.srcObject) return;

      // Visual Flash Effect
      if (flashEnabled) {
        const flash = document.getElementById('flash-layer');
        flash.classList.add('flash-effect');
        setTimeout(() => flash.classList.remove('flash-effect'), 400);
      }

      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;

      // Draw image
      context.save();
      if (facingMode === 'user') {
        context.translate(canvas.width, 0);
        context.scale(-1, 1);
      }
      context.drawImage(video, 0, 0, canvas.width, canvas.height);
      context.restore();

      // Apply Filters
      applyCanvasFilter(context, canvas.width, canvas.height, selectedFilter);

      // Increment Counter
      shotCount++;
      document.getElementById('shot-counter').innerText = String(shotCount).padStart(2, '0');

      // Convert to Base64 & Upload
      const imageDataBase64 = canvas.toDataURL('image/png').split(',')[1];
      const filename = `photos/PHOTO_${getTimestamp()}.png`;

      uploadToGitHub(filename, imageDataBase64, `Upload Gambar Retro #${shotCount}`);
    }

    function applyCanvasFilter(ctx, width, height, filter) {
      const imageData = ctx.getImageData(0, 0, width, height);
      const data = imageData.data;

      for (let i = 0; i < data.length; i += 4) {
        let r = data[i], g = data[i+1], b = data[i+2];

        if (filter === 'bw') {
          let avg = (r + g + b) / 3;
          data[i] = avg; data[i+1] = avg; data[i+2] = avg;
        } else if (filter === 'warm') {
          data[i] = Math.min(255, r * 1.15);
          data[i+1] = Math.min(255, g * 1.05);
          data[i+2] = Math.max(0, b * 0.9);
        } else if (filter === 'vintage') {
          data[i] = Math.min(255, (r * 0.393) + (g * 0.769) + (b * 0.189));
          data[i+1] = Math.min(255, (r * 0.349) + (g * 0.686) + (b * 0.168));
          data[i+2] = Math.min(255, (r * 0.272) + (g * 0.534) + (b * 0.131));
        }
      }
      ctx.putImageData(imageData, 0, 0);
    }

    // Audio Recording
    async function toggleRecording() {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        stopRecording();
      } else {
        startRecording();
      }
    }

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
        mediaRecorder.onstop = () => {
          audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          const audioUrl = URL.createObjectURL(audioBlob);
          const player = document.getElementById('audio-player');
          player.src = audioUrl;
          document.getElementById('audio-preview-container').classList.remove('hidden');
        };

        mediaRecorder.start();
        secondsRecorded = 0;
        document.getElementById('record-label').innerText = "Berhenti Merakam";
        document.getElementById('record-icon').className = "fa-solid fa-square text-xs text-red-500 animate-pulse";
        
        recordTimerInterval = setInterval(() => {
          secondsRecorded++;
          const mins = String(Math.floor(secondsRecorded / 60)).padStart(2, '0');
          const secs = String(secondsRecorded % 60).padStart(2, '0');
          document.getElementById('record-timer').innerText = `${mins}:${secs}`;
        }, 1000);

        logMessage("Merakam suara...");
      } catch (err) {
        logMessage("Akses mikrofon ditolak!", "error");
      }
    }

    function stopRecording() {
      mediaRecorder.stop();
      clearInterval(recordTimerInterval);
      document.getElementById('record-label').innerText = "Rakram Suara";
      document.getElementById('record-icon').className = "fa-solid fa-circle text-xs text-red-500";
      logMessage("Merakam selesai. Sedia untuk dihantar.");
    }

    function uploadVoiceNote() {
      if (!audioBlob) return;
      const reader = new FileReader();
      reader.readAsDataURL(audioBlob);
      reader.onloadend = () => {
        const base64Audio = reader.result.split(',')[1];
        const filename = `voice-notes/VOICE_${getTimestamp()}.webm`;
        uploadToGitHub(filename, base64Audio, "Upload Voice Note");
      };
    }

    // GitHub API Core Function
    async function uploadToGitHub(path, base64Content, commitMsg) {
      const token = localStorage.getItem('gh_token');
      const owner = localStorage.getItem('gh_owner');
      const repo = localStorage.getItem('gh_repo');
      const branch = localStorage.getItem('gh_branch') || 'main';

      if (!token || !owner || !repo) {
        logMessage("RALAT: Tetapan GitHub belum lengkap!", "error");
        toggleSettingsModal();
        return;
      }

      logMessage(`Memuat naik ke GitHub: ${path}...`);

      const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

      try {
        const response = await fetch(url, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github+json'
          },
          body: JSON.stringify({
            message: commitMsg,
            content: base64Content,
            branch: branch
          })
        });

        const data = await response.json();

        if (response.ok) {
          logMessage(`BERJAYA! Fail disimpan: ${path}`, "success");
        } else {
          logMessage(`RALAT GITHUB: ${data.message}`, "error");
        }
      } catch (err) {
        logMessage(`RALAT RANGKAIAN: ${err.message}`, "error");
      }
    }

    // Helpers & Settings
    function toggleSettingsModal() {
      const modal = document.getElementById('settings-modal');
      modal.classList.toggle('hidden');
    }

    function saveSettings() {
      localStorage.setItem('gh_token', document.getElementById('gh-token').value.trim());
      localStorage.setItem('gh_owner', document.getElementById('gh-owner').value.trim());
      localStorage.setItem('gh_repo', document.getElementById('gh-repo').value.trim());
      localStorage.setItem('gh_branch', document.getElementById('gh-branch').value.trim() || 'main');
      
      logMessage("Tetapan GitHub disimpan.", "success");
      toggleSettingsModal();
    }

    function loadSettings() {
      if (localStorage.getItem('gh_token')) document.getElementById('gh-token').value = localStorage.getItem('gh_token');
      if (localStorage.getItem('gh_owner')) document.getElementById('gh-owner').value = localStorage.getItem('gh_owner');
      if (localStorage.getItem('gh_repo')) document.getElementById('gh-repo').value = localStorage.getItem('gh_repo');
      if (localStorage.getItem('gh_branch')) document.getElementById('gh-branch').value = localStorage.getItem('gh_branch');
    }

    function getTimestamp() {
      const now = new Date();
      r
